<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星露灵猫 · 嘴部表情对照</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #2c3e63;
        --muted: #6b7ea3;
        --glass: rgba(255, 255, 255, 0.78);
        --line: rgba(120, 160, 215, 0.28);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px 32px 40px;
        min-height: 100vh;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 18% 8%, #f2f9ff 0%, #e4f0ff 38%, #e9e4fb 100%);
      }
      h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.5px; }
      .sub { margin: 0 0 24px; font-size: 13px; color: var(--muted); }
      .layout { display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
      .panel {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--glass);
        box-shadow: 0 12px 36px rgba(90, 125, 180, 0.14);
        backdrop-filter: blur(10px);
      }
      .hero-canvas {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 16px;
        background: linear-gradient(160deg, #eaf6ff, #dcd6f7);
      }
      .hero-title { margin: 16px 0 10px; font-size: 15px; font-weight: 600; }
      .controls { display: flex; flex-wrap: wrap; gap: 7px; }
      button {
        padding: 6px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: #dcecff; }
      button.active { background: #8fb8ee; border-color: #8fb8ee; color: #fff; }
      .status { margin: 14px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
      .card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--glass);
        box-shadow: 0 6px 20px rgba(90, 125, 180, 0.1);
      }
      .card canvas { display: block; width: 100%; aspect-ratio: 1.3; border-radius: 10px; background: #eef6ff; }
      .card strong { display: block; margin-top: 9px; font-size: 13px; }
      .card span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>星露灵猫 · 嘴部表情对照</h1>
    <p class="sub">所有口型均由运行时矢量绘制，覆盖在原参考图糊掉的嘴部区域之上；点击按钮可在左侧预览完整效果。</p>

    <div class="layout">
      <section class="panel">
        <canvas id="hero" class="hero-canvas" width="512" height="512"></canvas>
        <p class="hero-title">实时预览 · <span id="hero-label">微笑</span></p>
        <div class="controls" id="controls"></div>
        <p class="status" id="status">正在生成表情帧…</p>
      </section>
      <section class="grid" id="grid"></section>
    </div>

    <script type="module" src="/src/mouth-preview.ts"></script>
  </body>
</html>
