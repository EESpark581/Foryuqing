<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星露灵猫 - 设置</title>
    <link rel="stylesheet" href="./src/settings.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__head">
        <h1>星露灵猫</h1>
        <p>桌面宠物设置</p>
      </header>

      <section class="group">
        <h2>外观</h2>
        <label class="field">
          <span>大小 <output id="scale-value">100%</output></span>
          <input id="scale" type="range" min="0.5" max="2" step="0.05" />
        </label>
        <label class="field">
          <span>透明度 <output id="opacity-value">100%</output></span>
          <input id="opacity" type="range" min="0.3" max="1" step="0.05" />
        </label>
        <label class="field">
          <span>音量 <output id="volume-value">50%</output></span>
          <input id="volume" type="range" min="0" max="1" step="0.05" />
        </label>
      </section>

      <section class="group">
        <h2>行为</h2>
        <label class="check"><input id="autoLaunch" type="checkbox" /><span>开机自启</span></label>
        <label class="check"><input id="motionEnabled" type="checkbox" /><span>开启动效（关闭可减少资源占用）</span></label>
        <label class="check"><input id="gravityEnabled" type="checkbox" /><span>趴在屏幕底部</span></label>
        <label class="check"><input id="passthrough" type="checkbox" /><span>鼠标穿透（可用 Ctrl+Alt+P 恢复）</span></label>
      </section>

      <section class="group">
        <h2>提醒</h2>
        <label class="check"><input id="reminderEnabled" type="checkbox" /><span>久坐喝水提醒</span></label>
        <label class="field">
          <span>间隔（分钟）</span>
          <input id="reminderMinutes" type="number" min="1" max="240" step="1" />
        </label>
      </section>

      <footer class="panel__foot">
        <button id="btn-reset" class="btn btn--ghost" type="button">重置数据</button>
        <button id="btn-close" class="btn" type="button">完成</button>
      </footer>

      <p id="status" class="status" role="status"></p>
    </main>

    <script type="module" src="./src/settings.ts"></script>
  </body>
</html>
